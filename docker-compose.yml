# Sovereign Sentinel — local stack.
#
# ⚠️ UNVERIFIED: written without Docker installed on the authoring machine.
#    The Kafka path in this PR was verified against a native Apache Kafka 4.3.1
#    broker on localhost:9092, not against this file. Whoever has Docker first:
#    run it, fix what breaks, and drop this notice.
#
# Everything binds to 127.0.0.1 — nothing on this stack is reachable off the
# host (AGENTS.md §2: everything local, demo must survive Wi-Fi off).

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: sentinel-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: sentinel-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      # Applied on first start by the image's entrypoint, which runs the file
      # through clickhouse-client and so handles multi-statement SQL.
      - ./infra/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.0.2
    container_name: sentinel-grafana
    depends_on:
      clickhouse: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-sentinel}
      # The jury opens a link; a login wall is friction with no security value
      # on a loopback-only demo stack.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # ── Still missing: wazuh (board item 7). The adapter works against the
  #    file sink and the local receiver today; a real manager goes here.

volumes:
  clickhouse-data:
  grafana-data:
